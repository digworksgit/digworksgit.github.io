<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thinking of You</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #174b66 0%, #071723 55%, #02080d 100%);
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

h1 {
    font-weight: 300;
    font-size: 1.5rem;
    margin: 0 0 8px;
}

.instructions {
    color: #c8dcea;
    margin-bottom: 22px;
    font-size: 1rem;
}

/* Card stage provides 3-D perspective */
.card-stage {
    width: min(900px, 92vw);
    perspective: 1800px;
}

/* The complete card */
.card {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    cursor: pointer;
    transform-style: preserve-3d;
}

/* Inside message sits underneath */
.inside {
    position: absolute;
    inset: 0;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
        0 20px 55px rgba(0,0,0,.65),
        0 0 30px rgba(92,190,255,.10);
}

.inside img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* Front cover */
.front {
    position: absolute;
    inset: 0;
    transform-origin: bottom center;
    transform-style: preserve-3d;

    transition:
        transform 1.15s cubic-bezier(.45,.05,.20,1),
        box-shadow 1.15s ease;

    z-index: 2;

    border-radius: 8px;
    overflow: hidden;

    box-shadow:
        0 20px 55px rgba(0,0,0,.70),
        0 0 30px rgba(92,190,255,.15);

    backface-visibility: hidden;
}

.front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* OPEN CARD:
   bottom edge acts as the hinge */
.card.open .front {
    transform: rotateX(160deg);

    box-shadow:
        0 -15px 35px rgba(0,0,0,.45),
        0 5px 15px rgba(0,0,0,.25);
}

/* subtle highlight along fold */
.card::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;

    background: rgba(255,255,255,.18);

    opacity: 0;
    transition: opacity .5s ease;

    z-index: 3;
    pointer-events: none;
}

.card.open::after {
    opacity: 1;
}

/* Keyboard focus */
.card:focus-visible {
    outline: 3px solid #f5c768;
    outline-offset: 8px;
    border-radius: 8px;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    h1 {
        font-size: 1.2rem;
    }

    .instructions {
        font-size: .9rem;
    }
}

/* Respect accessibility preference */
@media (prefers-reduced-motion: reduce) {
    .front {
        transition-duration: .15s;
    }
}
</style>
</head>

<body>

<h1>Thinking of You</h1>

<div class="instructions" id="instruction">
    Click or tap the card to open
</div>

<div class="card-stage">

    <div
        class="card"
        id="card"
        role="button"
        tabindex="0"
        aria-label="Open Thinking of You card"
        aria-expanded="false"
    >

        <div class="inside">
            <img
                src="Dec%20Inner%20Message%201.jpg"
                alt="Inside message"
            >
        </div>

        <div class="front">
            <img
                src="Designer%20(1).jpg"
                alt="Thinking of You illuminated bridge card"
            >
        </div>

    </div>

</div>

<script>
const card = document.getElementById("card");
const instruction = document.getElementById("instruction");

function toggleCard() {
    const isOpen = card.classList.toggle("open");

    if (isOpen) {
        instruction.textContent = "Click or tap again to close";
        card.setAttribute("aria-label", "Close Thinking of You card");
        card.setAttribute("aria-expanded", "true");
    } else {
        instruction.textContent = "Click or tap the card to open";
        card.setAttribute("aria-label", "Open Thinking of You card");
        card.setAttribute("aria-expanded", "false");
    }
}

card.addEventListener("click", toggleCard);

card.addEventListener("keydown", function(event) {
    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleCard();
    }
});
</script>

</body>
</html>

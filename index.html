<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DignityWorks Card Gallery</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --background-dark: #02080d;
    --background-blue: #0b3043;
    --text-main: #ffffff;
    --text-soft: #c8dcea;
    --text-muted: #9fc0d2;
    --card-stock: #f2ede1;
    --card-edge: #d8d0bf;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at top center,
            #174b66 0%,
            #071723 48%,
            #02080d 100%
        );

    font-family: Arial, Helvetica, sans-serif;
    color: var(--text-main);

    padding: 40px 24px 70px;
}

/* PAGE HEADER */

header {
    max-width: 1100px;
    margin: 0 auto 45px;
    text-align: center;
}

h1 {
    margin: 0 0 10px;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 300;
    letter-spacing: .02em;
}

.subtitle {
    margin: 0 auto;
    max-width: 650px;

    color: var(--text-soft);

    font-size: 1.05rem;
    line-height: 1.6;
}

/* GALLERY */

.gallery {
    width: min(1100px, 100%);
    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));

    gap: 32px;
}

/* MONTH CARD */

.month-card {
    display: block;

    color: inherit;
    text-decoration: none;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 14px;

    padding: 20px;

    transition:
        transform .3s ease,
        background .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.month-card:hover,
.month-card:focus-visible {
    transform: translateY(-5px);

    background:
        rgba(255,255,255,.075);

    border-color:
        rgba(159,192,210,.45);

    box-shadow:
        0 18px 45px rgba(0,0,0,.35);
}

.month-card:focus-visible {
    outline: 3px solid #f5c768;
    outline-offset: 5px;
}

/* PHYSICAL CARD THUMBNAIL */

.thumbnail-card {
    background: var(--card-stock);

    border:
        2px solid var(--card-edge);

    border-radius: 7px;

    padding: 5%;

    aspect-ratio: 7 / 5;

    box-shadow:
        0 10px 28px rgba(0,0,0,.45);

    overflow: hidden;
}

.thumbnail-card img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    box-shadow:
        0 2px 7px rgba(0,0,0,.22);
}

/* MONTH INFORMATION */

.card-info {
    padding: 20px 3px 5px;
    text-align: center;
}

.month-name {
    margin: 0 0 6px;

    font-size: 1.35rem;
    font-weight: 400;
}

.theme {
    margin: 0 0 15px;

    color: var(--text-muted);

    font-size: .98rem;
}

.open-card {
    display: inline-block;

    color: var(--text-soft);

    font-size: .88rem;

    border-bottom:
        1px solid rgba(200,220,234,.45);

    padding-bottom: 3px;
}

/* FUTURE MONTH PLACEHOLDER */

.coming-soon {
    opacity: .48;
    cursor: default;
}

.coming-soon:hover {
    transform: none;
    background: rgba(255,255,255,.045);
    box-shadow: none;
    border-color: rgba(255,255,255,.10);
}

.placeholder {
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    color: #6f7e84;

    background:
        linear-gradient(
            145deg,
            #ece6d9,
            #f7f3ea
        );

    font-size: 1rem;
}

/* FOOTER */

footer {
    max-width: 900px;
    margin: 55px auto 0;

    text-align: center;

    color: #7797a8;

    font-size: .82rem;
}

/* PHONE */

@media (max-width: 600px) {

    body {
        padding:
            28px 15px 50px;
    }

    header {
        margin-bottom: 32px;
    }

    .gallery {
        gap: 22px;
    }
}

</style>
</head>

<body>

<header>

    <h1>DignityWorks Card Gallery</h1>

    <p class="subtitle">
        A collection of monthly cards created to offer
        connection, dignity, and a reminder that someone
        is thinking of you.
    </p>

</header>


<main class="gallery">

    <!-- DECEMBER 2026 -->

    <a
        class="month-card"
        href="cards/december/index.html"
        aria-label="Open December 2026 Thinking of You card"
    >

        <div class="thumbnail-card">

            <img
                src="Designer%20(1).jpg"
                alt="December Thinking of You illuminated bridge card"
            >

        </div>

        <div class="card-info">

            <h2 class="month-name">
                December 2026
            </h2>

            <p class="theme">
                Light &amp; Connection
            </p>

            <span class="open-card">
                Open interactive card
            </span>

        </div>

    </a>


    <!-- JANUARY PLACEHOLDER -->

    <div class="month-card coming-soon">

        <div class="thumbnail-card">

            <div class="placeholder">
                January card coming soon
            </div>

        </div>

        <div class="card-info">

            <h2 class="month-name">
                January 2027
            </h2>

            <p class="theme">
                The Shared Moon
            </p>

            <span class="open-card">
                Coming soon
            </span>

        </div>

    </div>

</main>


<footer>
    DignityWorks
</footer>

</body>
</html>

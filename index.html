<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thinking of You</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #174b66 0%,
            #071723 55%,
            #02080d 100%
        );

    font-family: Arial, Helvetica, sans-serif;
    color: white;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 25px;
    overflow-x: hidden;
}

h1 {
    font-weight: 300;
    font-size: 1.5rem;
    margin: 0 0 8px;
}

.instructions {
    color: #c8dcea;
    margin-bottom: 22px;
    font-size: 1rem;
}

/* 3-D STAGE */

.stage {
    width: min(900px, 92vw);
    perspective: 1400px;
    padding-top: 20px;
}

/* COMPLETE CARD */

.card {
    width: 100%;
    aspect-ratio: 3 / 2;

    position: relative;

    cursor: pointer;

    transform-style: preserve-3d;
}

/* INSIDE MESSAGE */

.inside {
    position: absolute;
    inset: 0;

    background: white;

    border-radius: 8px;
    overflow: hidden;

    box-shadow:
        0 20px 55px rgba(0,0,0,.65);
}

.inside img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
}

/* FRONT COVER */

.cover {
    position: absolute;
    inset: 0;

    z-index: 10;

    /*
       The top edge acts as the fold.
       The bottom edge lifts upward.
    */
    transform-origin: center top;

    transform: rotateX(0deg);

    transform-style: preserve-3d;

    /*
       IMPORTANT:
       Once the cover rotates beyond 90 degrees,
       the mirrored backside will NOT be visible.
    */
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    /*
       Slower, more deliberate opening.
    */
    transition:
        transform 2.25s cubic-bezier(.35,.05,.20,1),
        box-shadow 2.25s ease;

    border-radius: 8px;
    overflow: hidden;

    box-shadow:
        0 18px 40px rgba(0,0,0,.65);
}

.cover img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

/* OPEN POSITION */

.card.open .cover {
    transform: rotateX(115deg);

    box-shadow:
        0 -12px 32px rgba(0,0,0,.35);
}

/* MOVING SHADOW */

.cover-shadow {
    position: absolute;
    inset: 0;

    z-index: 5;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.50),
            rgba(0,0,0,.10) 45%,
            transparent 85%
        );

    opacity: 0;

    transition:
        opacity 1.6s ease;
}

.card.open .cover-shadow {
    opacity: .45;
}

/* FOLD LINE */

.fold {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 3px;

    background:
        rgba(255,255,255,.28);

    opacity: 0;

    transition:
        opacity .6s ease;

    z-index: 20;

    pointer-events: none;
}

.card.open .fold {
    opacity: 1;
}

/* KEYBOARD ACCESSIBILITY */

.card:focus-visible {
    outline: 3px solid #f5c768;
    outline-offset: 8px;

    border-radius: 8px;
}

/* PHONE / SMALL SCREEN */

@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    h1 {
        font-size: 1.2rem;
    }

    .instructions {
        font-size: .9rem;
    }
}

/* REDUCED MOTION ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {

    .cover {
        transition-duration: .2s;
    }

}

</style>
</head>

<body>

<h1>Thinking of You</h1>

<div
    class="instructions"
    id="instruction"
>
    Click or tap the card to open
</div>

<div class="stage">

    <div
        class="card"
        id="card"
        role="button"
        tabindex="0"
        aria-expanded="false"
        aria-label="Open Thinking of You card"
    >

        <!-- INSIDE MESSAGE -->

        <div class="inside">

            <img
                src="Dec%20Inner%20Message%201.jpg"
                alt="Inside message"
            >

        </div>

        <!-- SHADOW CREATED BY OPENING COVER -->

        <div class="cover-shadow"></div>

        <!-- FRONT COVER -->

        <div class="cover">

            <img
                src="Designer%20(1).jpg"
                alt="Thinking of You illuminated bridge card"
            >

        </div>

        <!-- FOLD -->

        <div class="fold"></div>

    </div>

</div>

<script>

const card =
    document.getElementById("card");

const instruction =
    document.getElementById("instruction");


function toggleCard() {

    const open =
        card.classList.toggle("open");

    if (open) {

        instruction.textContent =
            "Click or tap again to close";

        card.setAttribute(
            "aria-expanded",
            "true"
        );

        card.setAttribute(
            "aria-label",
            "Close Thinking of You card"
        );

    } else {

        instruction.textContent =
            "Click or tap the card to open";

        card.setAttribute(
            "aria-expanded",
            "false"
        );

        card.setAttribute(
            "aria-label",
            "Open Thinking of You card"
        );

    }
}


card.addEventListener(
    "click",
    toggleCard
);


card.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            toggleCard();

        }

    }
);

</script>

</body>
</html>
